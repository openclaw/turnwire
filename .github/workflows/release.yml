name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild without moving it
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            go: "1.27.2"
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            go: "1.27.2"
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            go: "1.26.9"
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            go: "1.26.9"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select immutable release source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Keep the workflow revision's packaging repair, but build tagged source.
          cp scripts/notarize-macos.sh "$RUNNER_TEMP/notarize-macos.sh"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Patched Go 1.26 retains macOS 12 support; Linux uses current Go.
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build archive and SBOM
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MACOS_SIGNING_P12: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGNING_P12 || '' }}
          MACOS_SIGNING_P12_PASSWORD: ${{ matrix.goos == 'darwin' && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
          ASC_KEY_ID: ${{ matrix.goos == 'darwin' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ matrix.goos == 'darwin' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY_P8: ${{ matrix.goos == 'darwin' && secrets.ASC_PRIVATE_KEY_P8 || '' }}
        run: |
          set -euo pipefail
          if [ "$GOOS" = darwin ]; then
            source scripts/macos-release-env.sh
          fi
          version="${RELEASE_TAG#v}"
          package="turnwire_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${package}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/openclaw/turnwire/internal/buildinfo.Version=${version} -X github.com/openclaw/turnwire/internal/buildinfo.Commit=${RELEASE_COMMIT} -X github.com/openclaw/turnwire/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${package}/turnwire" ./cmd/turnwire
          if [ "$GOOS" = darwin ]; then
            python3 -I scripts/check_macos_target.py "dist/${package}/turnwire"
            bash "$RUNNER_TEMP/notarize-macos.sh" "dist/${package}/turnwire"
          fi
          cp README.md LICENSE "dist/${package}/"
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            mod -json -output "dist/${package}/turnwire.cdx.json"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnwire-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: turnwire-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- ./*.tar.gz > checksums.txt
          cd ..
          awk -v version="${RELEASE_TAG#v}" '
            $1 == "##" && $2 == version && $3 == "-" { found = 1; print; next }
            found && $1 == "##" { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Turnwire $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
