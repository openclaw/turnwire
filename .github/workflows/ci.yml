name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27]
        go: ["1.26.10", "1.27.3"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race -timeout 5m ./...
      - run: go vet ./...
      - name: Check reachable vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build -trimpath ./cmd/turnwire
      - name: Exercise built CLI and MCP endpoints
        run: python3 -I scripts/smoke.py ./turnwire
      - if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build -trimpath ./cmd/turnwire

  macos-release:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      GOOS: darwin
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - name: Ensure Rosetta for x86_64 execution
        if: matrix.arch == 'amd64'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
      - name: Verify macOS release compatibility
        run: |
          set -euo pipefail
          python3 -IB -m unittest discover -s scripts -p 'test_*.py'
          source scripts/macos-release-env.sh
          go build -trimpath -ldflags "-s -w" -o turnwire ./cmd/turnwire
          python3 -I scripts/check_macos_target.py ./turnwire
          python3 -I scripts/smoke.py --arch ${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }} ./turnwire
